<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='theme.js') }}"></script>

    <title>{% block title %}{% endblock title %} - My Todo</title>

</head>

<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="/">
                <i class="bi bi-check2-square"></i>
                Todo List
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarSupportedContent">

                <div class="theme-switcher ms-lg-auto">
                    <button type="button" class="theme-dot" data-theme="light" title="Light"></button>
                    <button type="button" class="theme-dot" data-theme="midnight" title="Midnight"></button>
                    <button type="button" class="theme-dot" data-theme="ocean" title="Ocean"></button>
                    <button type="button" class="theme-dot" data-theme="sunset" title="Sunset"></button>
                    <button type="button" class="theme-dot" data-theme="forest" title="Forest"></button>
                    <button type="button" class="theme-dot" data-theme="rose" title="Rose"></button>
                </div>

                <form class="d-flex search-form" role="search" action="/" method="GET">
                    <input class="form-control search-box me-2" type="search" name="q" value="{{ query or '' }}"
                        placeholder="Search tasks..." aria-label="Search">

                    <button class="btn btn-primary search-btn" type="submit">
                        <i class="bi bi-search"></i>
                        Search
                    </button>
                </form>

            </div>
        </div>
    </nav>


    <main class="container main-container">

        {% block body %}

        {% endblock body %}

    </main>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
