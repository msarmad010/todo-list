
{% extends 'base.html' %}

{% block title %}Update Todo{% endblock title %}

{% block body %}

<div class="row justify-content-center">

    <div class="col-lg-7 col-md-9">

        <div class="update-card">

            <div class="text-center mb-4">

                <div class="update-icon">
                    <i class="bi bi-pencil-square"></i>
                </div>

                <h2 class="mt-3">Update Todo</h2>

                <p class="text-muted">
                    Make changes to your task and save them.
                </p>

            </div>


            <form action="/update/{{ todo.sno }}" method="POST">

                <div class="mb-3">

                    <label for="title" class="form-label">
                        Todo Title
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-pencil"></i>
                        </span>

                        <input type="text" name="title" class="form-control" id="title" value="{{ todo.title }}"
                            placeholder="Enter your todo title" required>

                    </div>

                </div>


                <div class="mb-4">

                    <label for="desc" class="form-label">
                        Description
                    </label>

                    <textarea name="desc" class="form-control" id="desc" rows="5"
                        placeholder="Write a short description..." required>{{ todo.desc }}</textarea>

                </div>


                <div class="d-flex gap-2">

                    <button type="submit" class="btn btn-primary update-btn">

                        <i class="bi bi-check-circle"></i>
                        Save Changes

                    </button>


                    <a href="/" class="btn btn-light cancel-btn">

                        <i class="bi bi-x-circle"></i>
                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock body %}
